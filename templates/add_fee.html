<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Fee Payment</title>

</head>

<body>

    <h1>Add Fee Payment</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <p>{{ message }}</p>

        {% endfor %}

    {% endwith %}

    <form method="POST">

        <label>Receipt No.</label>

        <br>

        <input
            type="text"
            name="receipt_no"
            required
        >

        <br><br>


        <label>Student</label>

        <br>

        <select name="student_id" required>

            <option value="">
                Select Student
            </option>

            {% for student in students %}

                <option value="{{ student.id }}">

                    {{ student.admission_no }}
                    -
                    {{ student.student_name }}

                </option>

            {% endfor %}

        </select>

        <br><br>


        <label>Course</label>

        <br>

        <select name="course_id">

            <option value="">
                Select Course
            </option>

            {% for course in courses %}

                <option value="{{ course.id }}">

                    {{ course.course_code }}
                    -
                    {{ course.course_name }}

                </option>

            {% endfor %}

        </select>

        <br><br>


        <label>Amount</label>

        <br>

        <input
            type="number"
            name="amount"
            step="0.01"
            min="0"
            required
        >

        <br><br>


        <label>Payment Date</label>

        <br>

        <input
            type="date"
            name="payment_date"
            required
        >

        <br><br>


        <label>Payment Mode</label>

        <br>

        <select name="payment_mode">

            <option value="Cash">
                Cash
            </option>

            <option value="UPI">
                UPI
            </option>

            <option value="Card">
                Card
            </option>

            <option value="Bank Transfer">
                Bank Transfer
            </option>

            <option value="Other">
                Other
            </option>

        </select>

        <br><br>


        <label>Remarks</label>

        <br>

        <textarea name="remarks"></textarea>

        <br><br>


        <button type="submit">
            Save Payment
        </button>

        <a href="{{ url_for('fees') }}">
            Cancel
        </a>

    </form>

</body>

</html>
