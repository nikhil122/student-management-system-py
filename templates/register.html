<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register</title>

</head>

<body>

    <h1>Create Account</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <p>{{ message }}</p>

        {% endfor %}

    {% endwith %}

    <form method="POST">

        <label>Name</label>

        <br>

        <input
            type="text"
            name="name"
            required
        >

        <br><br>


        <label>Username</label>

        <br>

        <input
            type="text"
            name="username"
            required
        >

        <br><br>


        <label>Email</label>

        <br>

        <input
            type="email"
            name="email"
            required
        >

        <br><br>


        <label>Password</label>

        <br>

        <input
            type="password"
            name="password"
            required
        >

        <br><br>


        <label>Confirm Password</label>

        <br>

        <input
            type="password"
            name="confirm_password"
            required
        >

        <br><br>


        <button type="submit">
            Register
        </button>

    </form>

    <br>

    <a href="{{ url_for('login') }}">
        Already have an account? Login
    </a>

</body>

</html>
